name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 22 * * 1-5'   # nightly regression, weekdays

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Smoke tests (fail fast)
        run: dotnet test --filter "Category=Smoke" --logger "trx;LogFileName=smoke.trx"

      - name: Full regression
        run: dotnet test --filter "Category=Regression" --logger "trx;LogFileName=regression.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
